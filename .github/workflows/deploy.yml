name: Build and Package

on:
  workflow_dispatch:
  

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -e .
  
    - name: Run build script
      run: |
        $env:PYTHON_EXE = (Get-Command python).Source
        .\scripts\create_exe.bat

    - name: Compile .ISS to .EXE Installer
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
      with:
        path: scripts/installer.iss

    - name: Upload SonicControl installer
      uses: actions/upload-artifact@v4
      with:
        name: SonicControl installer for Windows
        path: dist/SonicControlInstaller/*.exe
        if-no-files-found: error

    - name: Zip SonicControl
      run: |
        Compress-Archive -Path "./dist/SonicControl" -DestinationPath "./SonicControl.zip" -Update

    - name: Upload SonicControl zip archive
      uses: actions/upload-artifact@v4
      with:
        name: SonicControl for windows
        path: ./SonicControl.zip
